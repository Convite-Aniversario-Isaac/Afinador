:root{
  /* Noite no sertão: fundo anil escuro, acento cor de latão (como as tarraxas e trastes) */
  --bg:#12151d;
  --surface:#1c2130;
  --line:#2c3346;
  --ink:#ede7d7;
  --muted:#9ba1b3;
  --accent:#e0a83a;
  --good:#5cc98a;
  --warn:#e8735f;
  --display:"Zilla Slab", Georgia, serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* layout: um app de uma tela, cabeçalho com instrumento e afinação, conteúdo rolável, abas fixas embaixo */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em;white-space:nowrap}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:.75rem;text-align:right;line-height:1.25}
label.field{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:800;min-width:0}
select,button{font:inherit;color:inherit}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:600;width:100%;min-width:0}
select:focus-visible,button:focus-visible,input:focus-visible,.acorde:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
section{display:none;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
section.ativa{display:flex}
h2{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--accent);color:#1b1406;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;min-height:44px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a,.acorde,.corda{touch-action:manipulation;user-select:none;-webkit-user-select:none}

/* Afinador */
.nota-grande{font-family:var(--display);font-size:3.6rem;font-weight:700;text-align:center;line-height:1}
.nota-info{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.medidor{position:relative;height:44px;border-radius:10px;background:linear-gradient(90deg,rgba(232,115,95,.25),rgba(92,201,138,.35) 45%,rgba(92,201,138,.35) 55%,rgba(232,115,95,.25))}
.medidor .centro{position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:var(--ink);opacity:.5}
.medidor .agulha{position:absolute;top:0;bottom:0;width:4px;left:50%;margin-left:-2px;background:var(--accent);border-radius:2px;transition:left .12s linear}
.escala{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.status{text-align:center;font-weight:800;min-height:1.4em}
.status.ok{color:var(--good)}.status.fora{color:var(--warn)}
.aviso{border-left:3px solid var(--warn);padding:8px 12px;background:rgba(232,115,95,.08);border-radius:6px;font-size:.9rem;display:none}
.cordas{display:grid;gap:8px}
